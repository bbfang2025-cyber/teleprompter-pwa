        event.preventDefault();
        focusable[event.shiftKey ? focusable.length - 1 : 0].focus();
      }
    });

    sheetBackdrop.addEventListener('click', closeSheets);
    btnCloseScripts.addEventListener('click', closeSheets);
    btnCloseSettings.addEventListener('click', closeSheets);

    btnTopScript.addEventListener('click', () => {
      if (recState !== 'idle') return;
      openSheet(scriptsSheet);
    });

    btnSettings.addEventListener('click', () => {
      if (['idle', 'recording', 'paused'].includes(recState)) openSheet(settingsSheet);
    });

    function renderScriptsSheet() {
      const active = getActiveScript();
      scriptListEl.innerHTML = '';

      scripts.forEach((sc) => {
        const card = document.createElement('div');
        card.className = `script-card${sc.id === active.id ? ' active' : ''}`;

        const top = document.createElement('div');
        top.className = 'script-card-top';

        const selBtn = document.createElement('button');
        selBtn.type = 'button';
        selBtn.className = 'script-card-select';
        selBtn.setAttribute('aria-pressed', String(sc.id === active.id));
        const chars = countSpokenChars(sc.body);
        const est = estimateSeconds(sc.body);
        selBtn.innerHTML = `
          <div class="script-card-name">${escapeHtml(sc.title || '未命名稿件')}</div>
          <div class="script-card-meta">${chars} 字 · 约 ${est} 秒</div>
        `;
        selBtn.addEventListener('click', () => {
          settings.activeScriptId = sc.id;
          saveSettings();
          resetScrollToTop();
          renderActiveScript();
          renderScriptsSheet();
          scriptListEl.querySelector('.script-card.active button')?.focus();
        });

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'script-del-btn';
        delBtn.setAttribute('aria-label', '删除稿件');
        delBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`;
        delBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (scripts.length <= 1) {
            showToast('至少保留一篇稿件，可直接修改内容');
            return;
          }
          if (!confirm(`确定删除「${sc.title || '未命名稿件'}」吗？`)) return;
          scripts = scripts.filter((item) => item.id !== sc.id);
          if (settings.activeScriptId === sc.id) {
            settings.activeScriptId = scripts[0].id;
            saveSettings();
            resetScrollToTop();
          }
          saveScripts();
          renderActiveScript();
          renderScriptsSheet();
          scriptListEl.querySelector('.script-card.active button')?.focus();
        });

        top.appendChild(selBtn);
        top.appendChild(delBtn);
        card.appendChild(top);
        scriptListEl.appendChild(card);
      });

      scriptTitleInput.value = active.title || '';
      scriptBodyInput.value = active.body || '';
      updateEditorStats(active.body || '');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function updateEditorStats(text) {
      const chars = countSpokenChars(text);
      const sec = estimateSeconds(text);
      editorCharStat.textContent = `${chars} 字`;
      editorDurStat.textContent = `预计口播 ${sec} 秒`;
    }

    btnNewScript.addEventListener('click', () => {
      const newScript = {
        id: 'sc_' + Date.now() + '_' + Math.random().toString(36).slice(2),
        title: `新稿件 ${scripts.length + 1}`,
        body: '',
        updatedAt: Date.now()
      };
      scripts.unshift(newScript);
      settings.activeScriptId = newScript.id;
      saveScripts();
      saveSettings();
      resetScrollToTop();
      renderActiveScript();
      renderScriptsSheet();
      scriptTitleInput.focus();
    });

    scriptTitleInput.addEventListener('input', () => {
      const active = getActiveScript();
      active.title = scriptTitleInput.value;
      active.updatedAt = Date.now();
      saveScripts();
      hudScriptTitle.textContent = active.title || '未命名稿件';
      const activeCardName = scriptListEl.querySelector('.script-card.active .script-card-name');
      if (activeCardName) activeCardName.textContent = active.title || '未命名稿件';
    });

    scriptBodyInput.addEventListener('input', () => {
      const active = getActiveScript();
      active.body = scriptBodyInput.value;
      active.updatedAt = Date.now();
      saveScripts();
      updateEditorStats(active.body);
      renderActiveScript();
      const activeCardMeta = scriptListEl.querySelector('.script-card.active .script-card-meta');
      if (activeCardMeta) {
        activeCardMeta.textContent = `${countSpokenChars(active.body)} 字 · 约 ${estimateSeconds(active.body)} 秒`;
      }
    });

    // ---------- Rehearsal Mode (Test Scroll Without Recording) ----------
    btnRehearse.addEventListener('click', () => {
      if (recState !== 'idle') return;
      if (!isRehearsing && !getActiveScript().body.trim()) {
        showToast('请先在稿件库输入提词内容');
        return;
      }
      if (isRehearsing) {
        stopRehearsal();
      } else {
        isRehearsing = true;
        btnRehearse.textContent = '停止试滚';
        btnRehearse.classList.add('active');
        btnRehearse.setAttribute('aria-pressed', 'true');
        beginScrollEngine(false);
        requestWakeLock();
      }
    });

    function stopRehearsal() {
      if (!isRehearsing) return;
      isRehearsing = false;
      btnRehearse.textContent = '试滚';
      btnRehearse.classList.remove('active');
      btnRehearse.setAttribute('aria-pressed', 'false');
      stopScrollLoop();
      stopVoiceRecognition();
      releaseWakeLock();
    }

    function beginScrollEngine(withLeadDelay) {
      if (withLeadDelay && settings.leadDelay > 0 && getActiveScript().body.trim()) {
        leadTotal = settings.leadDelay;
        leadRemaining = settings.leadDelay;
        tpLeadFill.style.transform = 'scaleX(1)';
        tpLeadTrack.classList.add('active');
        tpLeadHint.textContent = `起读缓冲 ${settings.leadDelay.toFixed(1)}s`;
        tpLeadHint.classList.add('visible');
      } else {
        leadTotal = 0;
        leadRemaining = 0;
        tpLeadTrack.classList.remove('active');
        tpLeadHint.classList.remove('visible');
      }

      activeScrollMode = 'speed';
      if (settings.voiceFollow && isRehearsing) startVoiceRecognition();
      else if (settings.voiceFollow && withLeadDelay) showToast('录像使用匀速滚动，麦克风用于录音');
      startScrollLoop();
    }

    // ---------- Recording format and WebM metadata ----------
    const MIME_CANDIDATES = [
      'video/mp4;codecs=avc1,mp4a.40.2',
      'video/mp4;codecs=avc1.42001f,mp4a.40.2',
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4;codecs=avc1,mp4a',
      'video/mp4',
      'video/webm;codecs=vp8,opus',
      'video/webm;codecs=vp9,opus',
      'video/webm',
      ''
    ];

    async function identifyVideo(blob) {
      const bytes = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
      if (bytes[0] === 0x1a && bytes[1] === 0x45 && bytes[2] === 0xdf && bytes[3] === 0xa3) {
        return 'webm';
      }
      if (String.fromCharCode(...bytes.subarray(4, 8)) === 'ftyp') return 'mp4';
      throw new Error('无法识别录像容器');
    }

    function readVint(bytes, offset, isId = false) {
      const first = bytes[offset];
      let marker = 128;
      let width = 1;
      while (marker && !(first & marker)) {
        marker >>= 1;
        width++;
      }
      if (!marker || width > (isId ? 4 : 8) || offset + width > bytes.length) {
        throw new Error('EBML 元素头不完整');
      }
      let value = BigInt(isId ? first : first & (marker - 1));
      for (let i = 1; i < width; i++) value = (value << 8n) | BigInt(bytes[offset + i]);
      const unknown = !isId && value === (1n << BigInt(7 * width)) - 1n;
      if (!unknown && value > BigInt(Number.MAX_SAFE_INTEGER)) throw new Error('EBML 元素过大');
      return { value: unknown ? null : Number(value), width };
    }

    function encodeSize(value, width = 1) {
      let n = BigInt(value);
      while (width < 8 && n >= (1n << BigInt(width * 7)) - 1n) width++;
      n |= 1n << BigInt(width * 7);
      return encodeUint(n, width);
    }

    function encodeUint(value, width) {
      const bytes = new Uint8Array(width);
      let n = BigInt(value);
      for (let i = width - 1; i >= 0; i--) {
        bytes[i] = Number(n & 255n);
        n >>= 8n;
      }
      return bytes;
    }

    function uint(bytes) {
      let value = 0;
      for (const byte of bytes) value = value * 256 + byte;
      if (!Number.isSafeInteger(value)) throw new Error('WebM 时间戳超出精度范围');
      return value;
    }

    // Read only element headers and packet timing bytes. Large video payloads stay in Blob storage.
    class MediaBlobReader {
      constructor(blob) {
        this.blob = blob;
        this.bytes = new Uint8Array();
        this.offset = 0;
      }

      async read(offset, length) {
        if (offset < this.offset || offset + length > this.offset + this.bytes.length) {
          this.offset = offset;
          this.bytes = new Uint8Array(await this.blob.slice(offset, offset + Math.max(length, 262144)).arrayBuffer());
        }
        if (offset + length > this.offset + this.bytes.length) throw new Error('WebM 数据不完整');
        return this.bytes.subarray(offset - this.offset, offset - this.offset + length);
      }

      async element(start, limit) {
        const bytes = await this.read(start, Math.min(12, limit - start));
        const id = readVint(bytes, 0, true);
        const size = readVint(bytes, id.width);
        const sizeAt = start + id.width;
        const data = sizeAt + size.width;
        const end = size.value === null ? limit : data + size.value;
        if (end > limit) throw new Error('WebM 元素越界');
        return { id: id.value, start, sizeAt, data, end, unknown: size.value === null };
      }

      async *children(parent) {
        for (let pos = parent.data; pos < parent.end;) {
          const child = await this.element(pos, parent.end);
          if (child.unknown) throw new Error('WebM 子元素大小未知');
          yield child;
          pos = child.end;
        }
      }

      async number(element) {
        const length = element.end - element.data;
        if (length < 1 || length > 8) throw new Error('WebM 整数长度错误');
        return uint(await this.read(element.data, length));
      }
    }

    async function inspectMp4(blob) {
      const reader = new MediaBlobReader(blob);
      async function* boxes(start, limit) {
        for (let pos = start; pos < limit;) {
          if (limit - pos < 8) throw new Error('MP4 box 不完整');
          const header = await reader.read(pos, 8);
          const type = String.fromCharCode(...header.subarray(4, 8));
          const shortSize = uint(header.subarray(0, 4));
          let data = pos + 8;
          let end = shortSize ? pos + shortSize : limit;
          if (shortSize === 1) {
            end = pos + uint(await reader.read(data, 8));
            data += 8;
          }
          if (end < data || end > limit) throw new Error('MP4 box 越界');
          yield { type, data, end };
          pos = end;
        }
      }
      const handlers = new Set();
      let hasMedia = false;
      for await (const box of boxes(0, blob.size)) {
        if (box.type === 'mdat' && box.end > box.data) hasMedia = true;
        if (box.type !== 'moov') continue;
        for await (const track of boxes(box.data, box.end)) {
          if (track.type !== 'trak') continue;
          for await (const media of boxes(track.data, track.end)) {
            if (media.type !== 'mdia') continue;
            for await (const field of boxes(media.data, media.end)) {
              if (field.type === 'hdlr' && field.end - field.data >= 12) {
                handlers.add(String.fromCharCode(...await reader.read(field.data + 8, 4)));
                break;
              }
            }
          }
        }
      }
      if (!hasMedia || !handlers.has('vide')) throw new Error('MP4 缺少有效视频数据');
      return { hasAudio: handlers.has('soun') };
    }

    const WEBM_SEGMENT_IDS = new Set([
      0x114d9b74, 0x1549a966, 0x1f43b675, 0x1654ae6b,
      0x1c53bb6b, 0x1941a469, 0x1043a770, 0x1254c367
    ]);

    async function readWebmTracks(reader, element, tracks) {
      for await (const entry of reader.children(element)) {
        if (entry.id !== 0xae) continue;
        const track = { count: 0, last: -Infinity, deltas: [] };
        for await (const field of reader.children(entry)) {
          if (field.id === 0xd7) track.number = await reader.number(field);
          if (field.id === 0x83) track.type = await reader.number(field);
          if (field.id === 0x23e383) track.defaultNs = await reader.number(field);
          if (field.id === 0x56aa) track.delayNs = await reader.number(field);
          if (field.id === 0x86 && field.end - field.data <= 32) {
            track.codec = new TextDecoder().decode(await reader.read(field.data, field.end - field.data));
          }
        }
        if (track.type === 1 || track.type === 2) tracks.set(track.number, track);
      }
    }

    function opusPacketMs(bytes, at) {
      if (at >= bytes.length) return 0;
      const toc = bytes[at];
      const config = toc >> 3;
      const frameMs = config >= 16 ? 2.5 * (2 ** (config & 3))
        : config >= 12 ? 10 * (2 ** (config & 1)) : [10, 20, 40, 60][config & 3];
      const code = toc & 3;
      const frames = code === 0 ? 1 : code === 3 ? (bytes[at + 1] || 0) & 63 : 2;
      const size = frameMs * frames;
      return size <= 120 ? size : 0;
    }

    async function readWebmBlock(reader, element, ticks, tracks, duration, discardNs = 0) {
      const bytes = await reader.read(element.data, Math.min(13, element.end - element.data));
      const id = readVint(bytes, 0);
      const track = tracks.get(id.value);
      if (!track) return;
      const p = id.width;
      if (p + 3 >= bytes.length) throw new Error('WebM 数据包不完整');
      const relative = (bytes[p] << 24 >> 16) | bytes[p + 1];
      const time = ticks + relative;
      track.first = Math.min(track.first ?? time, time);
      if (time < track.last) return;
      const delta = time - track.last;
      if (Number.isFinite(delta) && delta > 0) {
        track.deltas.push(delta);
        if (track.deltas.length > 12) track.deltas.shift();
      }
      track.last = time;
      track.count++;
      track.lastDuration = duration;
      track.lastOpusMs = track.codec === 'A_OPUS' && !(bytes[p + 2] & 6) ? opusPacketMs(bytes, p + 3) : 0;
      track.discardNs = discardNs;
    }

    async function readWebmCluster(reader, element, tracks) {
      const cluster = { end: element.end, crc: [] };
      let ticks;
      for (let pos = element.data; pos < element.end;) {
        const child = await reader.element(pos, element.end);
        if (element.unknown && WEBM_SEGMENT_IDS.has(child.id)) {
          cluster.end = pos;
          break;
        }
        if (child.unknown) throw new Error('WebM Cluster 数据不完整');
        if (child.id === 0xe7) {
          ticks = await reader.number(child);
          cluster.time = child;
          cluster.ticks = ticks;
        } else if (child.id === 0xbf) {
          cluster.crc.push(child);
        } else if (child.id === 0xa3 || child.id === 0xa0) {
          if (ticks === undefined) throw new Error('WebM Cluster 缺少时间戳');
          if (child.id === 0xa3) {
            await readWebmBlock(reader, child, ticks, tracks, 0);
          } else {
            let block;
            let duration = 0;
            let discardNs = 0;
            for await (const field of reader.children(child)) {
              if (field.id === 0xa1) block = field;
              if (field.id === 0x9b) duration = await reader.number(field);
              if (field.id === 0x75a2) {
                const padding = await reader.read(field.data, field.end - field.data);
                if (padding.length && !(padding[0] & 0x80)) discardNs = uint(padding);
              }
            }
            if (block) await readWebmBlock(reader, block, ticks, tracks, duration, discardNs);
          }
        }
        pos = child.end;
      }
      return cluster;
    }

    async function fixWebmDuration(blob, elapsedMs) {
      const reader = new MediaBlobReader(blob);
      const header = await reader.element(0, blob.size);
      if (header.id !== 0x1a45dfa3 || header.unknown) throw new Error('缺少 WebM 文件头');
      for await (const field of reader.children(header)) {
        if (field.id === 0x4282) {
          const type = new TextDecoder().decode(await reader.read(field.data, field.end - field.data));
          if (type !== 'webm') throw new Error('媒体文件不是 WebM');
        }
      }
      const segment = await reader.element(header.end, blob.size);
      if (segment.id !== 0x18538067) throw new Error('缺少 WebM Segment');

      let scale = 1000000;
      let info;
      let durationField;
      const tracks = new Map();
      const clusters = [];
      const infoCrc = [];
      const segmentCrc = [];
      const indexes = [];
      for (let pos = segment.data; pos < segment.end;) {
        const element = await reader.element(pos, segment.end);
        pos = element.end;
        if (element.id === 0x1f43b675) {
          const cluster = await readWebmCluster(reader, element, tracks);
          clusters.push(cluster);
          pos = cluster.end;
          continue;
        }
        if (element.unknown) throw new Error('WebM Segment 子元素大小未知');
        if (element.id === 0x114d9b74 || element.id === 0x1c53bb6b) indexes.push(element);
        if (element.id === 0xbf) segmentCrc.push(element);
        if (element.id === 0x1654ae6b) await readWebmTracks(reader, element, tracks);
        if (element.id === 0x1549a966) {
          info = element;
          for await (const field of reader.children(info)) {
            if (field.id === 0x2ad7b1) scale = await reader.number(field);
            if (field.id === 0x4489) durationField = field;
            if (field.id === 0xbf) infoCrc.push(field);
          }
        }
      }
      const timed = [...tracks.values()].filter(track => track.count);
      if (!info || !(scale > 0) || !timed.some(track => track.type === 1)) {
        throw new Error('WebM 缺少有效视频时间轴');
      }
      const tickMs = scale / 1000000;
      const lastTick = Math.max(...timed.map(track => track.last));
      // Rebase only a clear clock-origin error. Legitimate delayed tracks retain their offset.
      let origin = Math.min(...timed.map(track => track.first));
      for (const cluster of clusters) {
        if (cluster.time) origin = Math.min(origin, cluster.ticks);
      }
      const absurdOrigin = origin * tickMs > Math.max(60000, elapsedMs * 4) &&
        (lastTick - origin) * tickMs <= elapsedMs + Math.max(1500, elapsedMs * 0.25);
      if (!absurdOrigin) origin = 0;

      const durationMs = Math.max(...timed.map(track => {
        const deltas = [...track.deltas].sort((a, b) => a - b);
        const cadenceMs = (deltas[Math.floor(deltas.length / 2)] || 0) * tickMs;
        const tailMs = track.lastDuration * tickMs || track.lastOpusMs ||
          (track.defaultNs || 0) / 1000000 || cadenceMs || 1000 / 30;
        return (track.last - origin) * tickMs + tailMs - ((track.delayNs || 0) + track.discardNs) / 1000000;
      }));
      if (!Number.isFinite(durationMs) || durationMs <= 0) throw new Error('WebM 时长无效');

      const edits = [];
      const replace = (start, end, bytes) => edits.push({ start, end, bytes });
      // A same-size Void leaves unrelated offsets and packet data intact.
      const voidElement = (element) => {
        const size = encodeSize(element.end - element.data, element.data - element.sizeAt);
        replace(element.start, element.data, new Uint8Array([0xec, ...size]));
      };
      const width = durationField ? durationField.end - durationField.data : 8;
      if (width !== 4 && width !== 8) throw new Error('WebM Duration 长度无效');
      const value = new Uint8Array(width);
      const view = new DataView(value.buffer);
      if (width === 4) view.setFloat32(0, durationMs / tickMs);
      else view.setFloat64(0, durationMs / tickMs);

      let sizeDelta = 0;
      if (durationField) {
        const old = await reader.read(durationField.data, width);
        const oldView = new DataView(old.buffer, old.byteOffset, width);
        const oldMs = (width === 4 ? oldView.getFloat32(0) : oldView.getFloat64(0)) * tickMs;
        // Keep a valid muxer duration when it agrees within the final video-frame cadence.
        const tolerance = Math.max(1, ...timed.filter(track => track.type === 1).map(track => {
          const deltas = [...track.deltas].sort((a, b) => a - b);
          return Math.min(100, (deltas[Math.floor(deltas.length / 2)] || 0) * tickMs);
        }));
        if (!origin && oldMs > 0 && Math.abs(oldMs - durationMs) <= tolerance) {
          return { blob, durationMs: oldMs, hasAudio: timed.some(track => track.type === 2) };
        }
        replace(durationField.data, durationField.end, value);
      } else {
        const field = new Uint8Array([0x44, 0x89, 0x88, ...value]);
        const size = encodeSize(info.end - info.data + field.length, info.data - info.sizeAt);
        sizeDelta = field.length + size.length - (info.data - info.sizeAt);
        replace(info.sizeAt, info.data, size);
        replace(info.end, info.end, field);
        if (!segment.unknown) {
          replace(segment.sizeAt, segment.data, encodeSize(segment.end - segment.data + sizeDelta, segment.data - segment.sizeAt));
        }
      }
      if (origin) {
        for (const cluster of clusters) {
          if (!cluster.time) continue;
          const { data, end } = cluster.time;
          replace(data, end, encodeUint(cluster.ticks - origin, end - data));
          cluster.crc.forEach(voidElement);
        }
      }
      if (sizeDelta || origin) {
        const editIndex = async (container) => {
          const checksums = [];
          const startCount = edits.length;
          for await (const field of reader.children(container)) {
            if (field.id === 0xbf) checksums.push(field);
            if (field.id === 0x4dbb || field.id === 0xbb || field.id === 0xb7 || field.id === 0xdb) {
              await editIndex(field);
            }
            const isPosition = field.id === 0x53ac || field.id === 0xf1 || field.id === 0x97;
            const isTime = field.id === 0xb3 || field.id === 0x96;
            if ((!isPosition || !sizeDelta) && (!isTime || !origin)) continue;
            const before = await reader.number(field);
            const after = isTime ? Math.max(0, before - origin)
              : before >= info.end - segment.data ? before + sizeDelta : before;
            if (after === before) continue;
            const width = field.end - field.data;
            if (BigInt(after) >= 1n << BigInt(8 * width)) throw new Error('WebM index offset overflow');
            replace(field.data, field.end, encodeUint(after, width));
          }
          if (edits.length > startCount) checksums.forEach(voidElement);
        };
        for (const index of indexes) {
          const startCount = edits.length;
          try {
            await editIndex(index);
          } catch (_) {
            edits.length = startCount;
            voidElement(index);
          }
        }
      }
      infoCrc.forEach(voidElement);
      segmentCrc.forEach(voidElement);

      const parts = [];
      let cursor = 0;
      for (const edit of edits.sort((a, b) => a.start - b.start || a.end - b.end)) {
        parts.push(blob.slice(cursor, edit.start), edit.bytes);
        cursor = edit.end;
      }
      parts.push(blob.slice(cursor));
      return { blob: new Blob(parts, { type: 'video/webm' }), durationMs, hasAudio: timed.some(track => track.type === 2) };
    }

    function updateDockForState() {
      const recordingOrPaused = recState === 'recording' || recState === 'paused';
      const idle = recState === 'idle';
      const canStop = recordingOrPaused || recState === 'starting';
      topIdleBar.style.display = idle ? 'flex' : 'none';
      btnShutter.disabled = !idle && !canStop;
      btnLeftAction.disabled = !idle && !recordingOrPaused;
      btnSettings.disabled = !idle && !recordingOrPaused;
      processingStatus.hidden = recState !== 'finalizing';
      recTimerPill.classList.toggle('visible', recordingOrPaused);
      recTimerPill.classList.toggle('paused', recState === 'paused');
      btnShutter.classList.toggle('recording', canStop);
      btnShutter.setAttribute('aria-label', canStop ? '停止录制' : '开始录制');

      if (!recordingOrPaused) {
        btnLeftAction.className = 'dock-pill-btn';
        btnLeftAction.innerHTML = `
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="8" y1="13" x2="16" y2="13"/>
            <line x1="8" y1="17" x2="14" y2="17"/>
          </svg>
          <span>稿件库</span>
        `;
      } else if (recState === 'recording') {
        btnLeftAction.className = 'dock-pill-btn pause-mode';
        btnLeftAction.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="5" width="4" height="14" rx="1"/>
            <rect x="14" y="5" width="4" height="14" rx="1"/>
          </svg>
          <span>暂停</span>
        `;
      } else {
        btnLeftAction.className = 'dock-pill-btn pause-mode is-paused';
        btnLeftAction.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="7,5 19,12 7,19"/>
          </svg>
          <span>继续</span>
        `;
      }
    }

    // ---------- Countdown, recording and review ----------
    const MAX_RECORDING_BYTES = 160 * 1024 * 1024;
    let recording = null;
    let reviewFile = null;
    let sharePending = false;
    let reviewInfo = null;
    let takeGeneration = 0;

    function updateRecTimerLoop() {
      timerRafId = null;
      if (recState !== 'recording') return;
      const label = formatTime(activeRecordedMs + performance.now() - activeSegmentStart);
      if (recTimerText.textContent !== label) recTimerText.textContent = label;
      timerRafId = requestAnimationFrame(updateRecTimerLoop);
    }

    function stopRecTimer() {
      if (timerRafId !== null) cancelAnimationFrame(timerRafId);
      timerRafId = null;
    }

    btnLeftAction.addEventListener('click', () => {
      if (recState === 'idle') openSheet(scriptsSheet);
      else if (recState === 'recording') pauseRecording();
      else if (recState === 'paused') resumeRecording();
    });

    btnShutter.addEventListener('click', () => {
      if (recState === 'idle') startCountdownAndRecord();
      else if (['recording', 'paused', 'starting'].includes(recState)) stopRecording();
    });

    async function startCountdownAndRecord() {
      if (typeof MediaRecorder === 'undefined') {
        showToast('当前浏览器不支持网页录像，请升级或更换 Safari / Chrome');
        return;
      }
      const generation = ++takeGeneration;
      recState = 'preparing';
      stopRehearsal();
      closeSheets();
      noCamera = false;
      resetScrollToTop();
      updateDockForState();
      countdownOverlay.classList.add('visible');
      countdownCancel.focus();
      countdownNumber.textContent = '…';
      countdownStatus.textContent = '正在开启摄像头和麦克风';
      requestWakeLock();
      await speechRelease;
      if (generation !== takeGeneration || recState !== 'preparing') return;
      const ready = await initCamera(true);
      if (generation !== takeGeneration || recState !== 'preparing') return;
      if (!ready || !usableTrack(stream, 'audio')) {
        cancelCountdown(null, false);
        return;
      }

      cameraFallback.classList.remove('visible');
      recState = 'countdown';
      countdownStatus.textContent = '即将开拍';
      let count = 3;
      renderCountdownDigit(count);
      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          renderCountdownDigit(count);
          return;
        }
        clearInterval(countdownTimer);
        countdownTimer = null;
        countdownOverlay.classList.remove('visible');
        startActualRecording();
      }, 1000);
    }

    function cancelCountdown(message, restartPreview = true) {
      takeGeneration++;
      clearInterval(countdownTimer);
      countdownTimer = null;
      countdownOverlay.classList.remove('visible');
      recState = 'idle';
      releaseCamera();
      releaseWakeLock();
      updateDockForState();
      if (!document.hidden) btnShutter.focus();
      if (restartPreview) startPreview();
      if (message) showToast(message);
    }

    function renderCountdownDigit(num) {
      countdownNumber.textContent = String(num);
      countdownNumber.style.animation = 'none';
      void countdownNumber.offsetWidth;
      countdownNumber.style.animation = '';
    }

    countdownOverlay.addEventListener('click', () => {
      if (recState === 'preparing' || recState === 'countdown') cancelCountdown('已取消开拍');
    });

    function startActualRecording() {
      if (document.hidden || !usableTrack(stream, 'video') || !usableTrack(stream, 'audio')) {
        cancelCountdown('摄像头或麦克风未就绪，请重试');
        return;
      }
      recState = 'starting';
      updateDockForState();
      btnShutter.focus();
      activeRecordedMs = 0;

      const candidates = MIME_CANDIDATES.filter(mime => {
        if (!mime || typeof MediaRecorder.isTypeSupported !== 'function') return true;
        try { return MediaRecorder.isTypeSupported(mime); } catch (_) { return false; }
      });
      const attempt = () => {
        while (candidates.length && recState === 'starting') {
          const mimeType = candidates.shift();
          let recorder;
          try {
            const options = mimeType ? { mimeType, videoBitsPerSecond: 4500000 } : { videoBitsPerSecond: 4500000 };
            recorder = new MediaRecorder(stream, options);
          } catch (_) {
            continue;
          }

          const take = { recorder, chunks: [], bytes: 0, started: false, timeout: null, notice: '' };
          recording = take;
          recorder.onstart = () => {
            if (recording !== take || recState !== 'starting') return;
            clearTimeout(take.timeout);
            take.started = true;
            activeSegmentStart = performance.now();
            recState = 'recording';
            updateDockForState();
            recTimerText.textContent = '00:00';
            timerRafId = requestAnimationFrame(updateRecTimerLoop);
            beginScrollEngine(true);
          };
          recorder.ondataavailable = (event) => {
            if (recording !== take || !event.data?.size) return;
            take.chunks.push(event.data);
            take.bytes += event.data.size;
            if (take.bytes >= MAX_RECORDING_BYTES && recState === 'recording') {
              stopRecording('本段录像已达到页面的内存保护阈值，已停止录制');
            }
          };
          const retry = () => {
            detachRecorder(take);
            recording = null;
            attempt();
          };
          recorder.onerror = () => {
            if (recording !== take) return;
            if (recState === 'starting' && !take.started && recorder.state === 'inactive') {
              retry();
              return;
            }
            stopRecording('录像意外中断，正在尝试保留已录片段');
          };
          recorder.onstop = () => {
            if (recording !== take) return;
            if (recState === 'starting' && !take.started && !take.bytes) {
              retry();
              return;
            }
            finalizeRecording(take);
          };
          try {
            recorder.start(1000);
            take.timeout = setTimeout(() => {
              if (recording !== take || recState !== 'starting') return;
              if (take.bytes) {
                stopRecording('录像编码器启动超时');
                return;
              }
              try { if (recorder.state !== 'inactive') recorder.stop(); } catch (_) {}
              retry();
            }, 5000);
            return;
          } catch (_) {
            detachRecorder(take);
            recording = null;
          }
        }
        cancelCountdown('无法启动录像编码器，请重试');
      };
      attempt();
    }

    function detachRecorder(take) {
      clearTimeout(take.timeout);
      const { recorder } = take;
      recorder.onstart = recorder.ondataavailable = recorder.onerror = recorder.onstop = null;
    }

    function pauseRecording() {
      if (recording?.recorder.state !== 'recording') return;
      try {
        recording.recorder.pause();
      } catch (_) {
        showToast('当前录像无法暂停');
        return;
      }
      activeRecordedMs += performance.now() - activeSegmentStart;
      recState = 'paused';
      stopRecTimer();
      recTimerText.textContent = '已暂停 ' + formatTime(activeRecordedMs);
      stopScrollLoop();
      updateDockForState();
    }

    function resumeRecording() {
      if (recording?.recorder.state !== 'paused') return;
      try {
        recording.recorder.resume();
      } catch (_) {
        showToast('当前录像无法继续，请停止并保存');
        return;
      }
      activeSegmentStart = performance.now();
      recState = 'recording';
      updateDockForState();
      timerRafId = requestAnimationFrame(updateRecTimerLoop);
      if (leadRemaining > 0) {
        tpLeadTrack.classList.add('active');
        tpLeadHint.classList.add('visible');
      }
      startScrollLoop();
    }

    function enterFinalizing() {
      if (recState === 'recording') activeRecordedMs += performance.now() - activeSegmentStart;
      recState = 'finalizing';
      stopRecTimer();
      stopScrollLoop();
      stopVoiceRecognition();
      closeSheets();
      releaseWakeLock();
      updateDockForState();
    }

    function stopRecording(notice = '') {
      const take = recording;
      if (!take || recState === 'finalizing') return;
      take.notice ||= notice;
      enterFinalizing();
      if (notice) showToast(notice, 4200);
      clearTimeout(take.timeout);
      take.timeout = setTimeout(() => {
        if (recording === take) {
          take.notice ||= '浏览器停止回调超时，请检查保留下来的片段';
          finalizeRecording(take);
        }
      }, 5000);
      try {
        if (take.recorder.state !== 'inactive') take.recorder.stop();
      } catch (_) {
        // A failing recorder may still dispatch its final data before the watchdog.
      }
    }

    async function finalizeRecording(take) {
      if (recording !== take) return;
      const generation = takeGeneration;
      const stillCurrent = () => recState === 'finalizing' && generation === takeGeneration;
      if (recState !== 'finalizing') {
        take.notice ||= '录像意外结束，请检查保留下来的片段';
        enterFinalizing();
      }
      detachRecorder(take);
      if (take.recorder.state !== 'inactive') {
        try { take.recorder.stop(); } catch (_) {}
      }
      recording = null;
      releaseCamera();
      try {
        if (!take.bytes) throw new Error('浏览器没有生成录像数据');
        const raw = new Blob(take.chunks);
        take.chunks.length = 0;
        const ext = await identifyVideo(raw);
        if (!stillCurrent()) return;
        let blob = new Blob([raw], { type: 'video/' + ext });
        let durationMs;
        if (ext === 'webm') {
          try {
            const result = await fixWebmDuration(blob, activeRecordedMs);
            blob = result.blob;
            durationMs = result.durationMs;
            if (!result.hasAudio) take.notice = '此片段没有检测到编码后的音轨';
          } catch (error) {
            console.warn('WebM duration:', error);
            take.notice = 'WebM 时长校验失败，可尝试下载原始录像';
          }
        } else {
          try {
            const result = await inspectMp4(blob);
            if (!result.hasAudio) take.notice = '此片段没有检测到编码后的音轨';
          } catch (error) {
            console.warn('MP4 validation:', error);
            take.notice = 'MP4 文件完整性校验失败，请先回看并检查画面和声音';
          }
        }
        if (stillCurrent()) openReviewScreen(blob, ext, durationMs, take.notice);
      } catch (error) {
        if (!stillCurrent()) return;
        console.warn('Recording export:', error);
        recState = 'idle';
        updateDockForState();
        startPreview();
        showToast(take.notice || '录像文件无法读取，请重试', 4200);
      }
    }

    function releaseReviewMedia() {
      reviewFile = null;
      reviewInfo = null;
      reviewVideo.pause();
      reviewVideo.removeAttribute('src');
      reviewVideo.load();
      btnDownload.removeAttribute('href');
      btnDownload.removeAttribute('download');
      if (currentVideoUrl) URL.revokeObjectURL(currentVideoUrl);
      currentVideoUrl = '';
      sharePending = false;
      btnSaveAlbum.disabled = false;
      btnRetake.disabled = false;
      reviewOverlay.classList.remove('visible');
    }

    function openReviewScreen(blob, ext, durationMs, notice) {
      releaseReviewMedia();
      const filename = makeTimestampFilename(ext);
      reviewFile = new File([blob], filename, { type: blob.type });
      currentVideoUrl = URL.createObjectURL(reviewFile);
      reviewInfo = { ext, durationMs, sizeMb: (blob.size / (1024 * 1024)).toFixed(1) };
      reviewVideo.src = currentVideoUrl;
      reviewNotice.textContent = notice || '';
      btnSaveAlbum.querySelector('span').textContent = ext === 'webm' ? '分享 WebM' : '保存到手机相册';
      btnDownload.href = currentVideoUrl;
      btnDownload.download = filename;
      reviewOverlay.classList.add('visible');
      recState = 'review';
      updateDockForState();
      renderReviewMeta();
      btnSaveAlbum.focus();
    }

    function renderReviewMeta() {
      if (!reviewInfo) return;
      const { ext, durationMs, sizeMb } = reviewInfo;
      const metadataMs = reviewVideo.duration * 1000;
      const knownMs = durationMs ?? (Number.isFinite(metadataMs) && metadataMs > 0 ? metadataMs : null);
      const roundedMs = knownMs === null ? null : Math.round(knownMs / 100) * 100;
      const time = roundedMs === null ? '时长待确认' : formatTime(roundedMs) + '.' + (roundedMs % 1000) / 100;
      reviewMeta.textContent = [time, ext.toUpperCase(), sizeMb + ' MB'].join(' · ');
    }

    reviewVideo.addEventListener('loadedmetadata', renderReviewMeta);
    reviewVideo.addEventListener('durationchange', renderReviewMeta);
    reviewVideo.addEventListener('error', () => {
      if (reviewFile) reviewNotice.textContent ||= '当前浏览器无法回看，可下载文件后尝试播放';
    });

    function makeTimestampFilename(ext) {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const date = [d.getFullYear(), pad(d.getMonth() + 1), pad(d.getDate())].join('');
      const time = [pad(d.getHours()), pad(d.getMinutes()), pad(d.getSeconds())].join('');
      return '口播_' + date + '_' + time + '.' + ext;
    }

    btnDownload.addEventListener('click', () => {
      showToast('已请求下载，请在浏览器下载列表或文件应用查看', 4200);
    });

    btnSaveAlbum.addEventListener('click', () => {
      const file = reviewFile;
      if (!file || sharePending) return;
      const data = { files: [file] };
      let canShare = false;
      try { canShare = typeof navigator.share === 'function' && navigator.canShare?.(data); } catch (_) {}
      if (!canShare) {
        btnDownload.click();
        return;
      }
      try {
        // Start sharing in this click, before any await, timer, or media processing.
        const pending = navigator.share(data);
        sharePending = true;
        btnSaveAlbum.disabled = true;
        btnRetake.disabled = true;
        Promise.resolve(pending).catch(error => {
          if (reviewFile === file && error?.name !== 'AbortError') {
            showToast('系统分享未完成，可点「下载文件」保存', 4200);
          }
        }).finally(() => {
          if (reviewFile === file) {
            sharePending = false;
            btnSaveAlbum.disabled = false;
            btnRetake.disabled = false;
          }
        });
      } catch (_) {
        showToast('无法打开系统分享，可点「下载文件」保存', 4200);
      }
    });

    btnRetake.addEventListener('click', () => {
      if (sharePending) return;
      releaseReviewMedia();
      recState = 'idle';
      resetScrollToTop();
      updateDockForState();
      btnShutter.focus();
      startPreview();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopRehearsal();
        releaseWakeLock();
        if (recState === 'preparing' || recState === 'countdown') cancelCountdown(null, false);
        else if (['starting', 'recording', 'paused'].includes(recState)) stopRecording('页面转入后台，已结束本段录像');
        else if (recState === 'idle') releaseCamera();
      } else {
        startPreview();
      }
    });

    window.addEventListener('pagehide', () => {
      takeGeneration++;
      clearInterval(countdownTimer);
      countdownTimer = null;
      countdownOverlay.classList.remove('visible');
      closeSheets();
      stopRehearsal();
      stopRecTimer();
      stopScrollLoop();
      stopVoiceRecognition();
      releaseWakeLock();
      if (recording) {
        detachRecorder(recording);
        try { if (recording.recorder.state !== 'inactive') recording.recorder.stop(); } catch (_) {}
        recording.chunks.length = 0;
        recording = null;
      }
      releaseCamera();
      releaseReviewMedia();
      recState = 'idle';
      updateDockForState();
    });

    window.addEventListener('pageshow', startPreview);

    // ---------- Boot ----------
    applySpeed(settings.speed, false);
    applyAppearance();
    renderActiveScript();
    initWindowRect();
    updateDockForState();
    startPreview();

  })();
  </script>
</body>
</html>
