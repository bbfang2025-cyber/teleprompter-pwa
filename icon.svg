<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1d22"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="lens" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#3a4a6b"/>
      <stop offset="55%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Frosted teleprompter card -->
  <rect x="86" y="102" width="340" height="196" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.5"/>
  <rect x="216" y="122" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.45"/>

  <!-- Teleprompter script lines -->
  <rect x="122" y="156" width="268" height="18" rx="9" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="122" y="196" width="224" height="18" rx="9" fill="#ffffff" fill-opacity="0.62"/>
  <rect x="122" y="236" width="176" height="18" rx="9" fill="#ffffff" fill-opacity="0.34"/>

  <!-- Camera lens + red record dot -->
  <circle cx="256" cy="368" r="64" fill="url(#lens)" stroke="#ffffff" stroke-opacity="0.24" stroke-width="4"/>
  <circle cx="256" cy="368" r="44" fill="none" stroke="#64d2ff" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="256" cy="368" r="24" fill="#ff3b30"/>
  <circle cx="244" cy="356" r="8" fill="#ffffff" fill-opacity="0.35"/>
</svg>
